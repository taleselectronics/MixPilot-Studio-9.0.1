name: Build MixPilot Studio 9.0.1 - Audio Intelligence Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Do not select the first CMakeLists.txt/source_checks.py found:
      # earlier MixPilot revisions may remain in deeply nested folders.
      - name: Select MixPilot 9.0.1 project
        shell: pwsh
        run: |
          $workspace = (Resolve-Path .).Path
          $candidates = @(
            Get-ChildItem -Path $workspace -Filter AudioIntelligenceEngine.cpp -File -Recurse |
              Where-Object { $_.FullName -notmatch '[\/]build[\/]' } |
              ForEach-Object { $_.Directory.Parent.Parent.FullName } |
              Where-Object {
                (Test-Path -LiteralPath (Join-Path $_ 'CMakeLists.txt')) -and
                (Test-Path -LiteralPath (Join-Path $_ 'tests/source_checks.py')) -and
                (Test-Path -LiteralPath (Join-Path $_ 'Source/PluginProcessor.cpp'))
              } |
              Sort-Object -Unique
          )

          if ($candidates.Count -eq 0) {
            throw 'MixPilot 9.0.1 project not found. Upload the archive contents, preserving Source/Analysis, tests, and CMakeLists.txt.'
          }

          $preferred = @($candidates | Where-Object { $_ -eq $workspace })
          if ($preferred.Count -eq 1) {
            $selected = $preferred[0]
          } elseif ($candidates.Count -eq 1) {
            $selected = $candidates[0]
          } else {
            $candidates | ForEach-Object { Write-Host "Candidate: $_" }
            throw 'Multiple nested 9.0.1 projects found. Keep one project or move the intended version to repository root.'
          }

          Write-Host "Building MixPilot 9.0.1 from: $selected"
          "MIXPILOT_SOURCE_DIR=$selected" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Confirm required source files exist
        shell: pwsh
        run: |
          $required = @(
            'CMakeLists.txt', 'README.md',
            'Source/PluginProcessor.cpp', 'Source/PluginProcessor.h',
            'Source/PluginEditor.cpp', 'Source/PluginEditor.h',
            'Source/SaturationMath.h', 'Source/SpectralProfiler.h',
            'Source/ReferenceEQ.h', 'Source/ReliabilityDSP.h',
            'Source/AI/VocalChainPlanner.h', 'Source/AI/ReferenceMetrics.h',
            'Source/Modules/ModuleHelpers.h', 'Source/Modules/ModuleDispatch.cpp',
            'Source/Modules/PrecisionEQ.cpp', 'Source/Modules/FET76.cpp',
            'Source/Modules/OptoLeveler.cpp', 'Source/Modules/DeEsser.cpp',
            'Source/Modules/Saturation.cpp', 'Source/Modules/Delay.cpp',
            'Source/Modules/Reverb.cpp', 'Source/Modules/Phaser.cpp',
            'Source/Modules/ChorusFlanger.cpp', 'Source/Modules/StereoWidth.cpp',
            'Source/Analysis/AudioIntelligenceEngine.h',
            'Source/Analysis/AudioIntelligenceEngine.cpp',
            'tests/source_checks.py', 'tests/audio_intelligence_test.cpp',
            'tests/reliability_dsp_test.cpp', 'tests/spectral_saturation_test.cpp',
            'tests/vocal_planner_test.cpp'
          )
          foreach ($path in $required) {
            $full = Join-Path $env:MIXPILOT_SOURCE_DIR $path
            if (-not (Test-Path -LiteralPath $full)) {
              throw "Required MixPilot 9.0.1 file missing: $full"
            }
          }

      - name: Configure Windows VST3
        shell: pwsh
        run: |
          cmake -S "$env:MIXPILOT_SOURCE_DIR" -B build -G 'Visual Studio 17 2022' -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check source structure
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = '1'
          python (Join-Path $env:MIXPILOT_SOURCE_DIR 'tests/source_checks.py')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile standalone DSP regression tests
        shell: pwsh
        run: |
          cmake --build build --config Release --target MixPilotReliabilityTests MixPilotAnalysisTests MixPilotVocalPlannerTests MixPilotIntelligenceTests --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run standalone DSP regression tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile VST3
        shell: pwsh
        run: |
          cmake --build build --config Release --target MixPilotStudio8_VST3 --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: MixPilotStudio901-AudioIntelligence-Windows-VST3
          path: build/MixPilotStudio8_artefacts/Release/VST3/
          if-no-files-found: error
